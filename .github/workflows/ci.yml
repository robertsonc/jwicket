# J-Wicket CI. Read-only: no secrets, no deployment, nothing here touches a device.
#
# Every action is pinned by full commit SHA with its version as a comment (Spec 006 section 11.4), and
# no run: script contains ${{ }}: values reach scripts through env: and are quoted
# (tests/test_workflows.py checks both, here and in release.yml).
name: ci

on:
  # Pull requests run on their own event; push runs only for the default branch, so one push to a
  # PR branch starts one run, not two.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check src tests tools deploy
      - name: mypy (strict, Python 3.8 target, the oldest mypy 1.11 accepts; see pyproject.toml)
        run: mypy

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.7 is the floor: Junos 25.2 and 26.2 ship Python 3.7 on the SRX (Q-RT-01). setup-python
        # has no 3.7 for ubuntu-24.04, so that one job runs on ubuntu-22.04.
        python: ["3.7", "3.9", "3.11", "3.13"]
        os: [ubuntu-24.04]
        exclude:
          - python: "3.7"
            os: ubuntu-24.04
        include:
          - python: "3.7"
            os: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Bundle self-test on this Python
        # The bundle's own loader code must run on every supported interpreter, not only the one
        # the bundle job uses. Run isolated and outside the checkout so nothing comes from src/.
        run: |
          python tools/bundle.py --out "$RUNNER_TEMP/jwicket.py"
          cd "$RUNNER_TEMP"
          python -I jwicket.py --bundle-self-test

  js:
    name: js (node --test)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # v7 caches by itself when a package.json names a package manager. There is none here, and
          # CI keeps no cache it did not ask for.
          package-manager-cache: false
      - name: Query language and log parser tests (no packages)
        # Node 22 does not take a directory for --test; the shell expands the glob.
        run: node --test tests/js/*.test.mjs

  bundle:
    name: bundle (dist/jwicket.py)
    needs: [lint, test, js]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build
        run: python tools/bundle.py --out dist/jwicket.py --source-ref "$SOURCE_REF"
      - name: Rebuild and compare (the build must be reproducible)
        run: python tools/bundle.py --out dist/jwicket.py --source-ref "$SOURCE_REF" --check
      - name: Self-test, isolated and outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/dist/jwicket.py" --bundle-self-test
      - name: Checksum
        run: |
          sha256sum dist/jwicket.py
          {
            echo "### dist/jwicket.py"
            echo
            echo "Lab qualification only; not installable on a production SRX (docs/deploy-lab.md)."
            echo
            echo '```'
            sha256sum dist/jwicket.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jwicket-bundle-${{ github.sha }}
          path: dist/jwicket.py
          if-no-files-found: error
          retention-days: 14

  reproduce:
    name: reproduce (release assets equal on Python 3.12, 3.7, 3.9 and 3.13)
    # release.yml builds the four assets on 3.12 and refuses to publish unless its rebuild jobs on 3.7 (the
    # SRX's Python), 3.9 and 3.13 give the same bytes. The same builds run here on every pull request, so
    # a difference, or a build tool that no longer runs on 3.7, shows before a release tag does. One
    # ubuntu-22.04 runner: setup-python has no 3.7 for ubuntu-24.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Each listed version is on PATH as python3.X; the last one is also the default python.
          python-version: |
            3.7
            3.9
            3.13
            3.12
      - name: Build the four assets with each Python and compare them with the 3.12 build
        run: |
          version=$(PYTHONPATH=src python3.12 -c "import jwicket; print(jwicket.__version__)")
          tag="v$version"
          epoch=$(git log -1 --format=%ct "$SOURCE_REF")
          first=""
          for python in python3.12 python3.7 python3.9 python3.13; do
            out="$RUNNER_TEMP/$python"
            mkdir "$out"
            "$python" tools/bundle.py --out "$out/jwicket.py" --source-ref "$SOURCE_REF"
            PYTHONPATH=tools "$python" -m jwicket_install.build_op --bundle "$out/jwicket.py" --tag "$tag" \
              --repo "$GITHUB_REPOSITORY" --out "$out/jwicket-install-op.py"
            "$python" tools/build_wheel.py --out "$out" --source-date-epoch "$epoch"
            cp requirements-install.txt "$out/requirements-install.txt"
            (cd "$out" && sha256sum jwicket.py jwicket-install-op.py jwicket_install-*.whl requirements-install.txt > SHA256SUMS)
            echo "$python:"
            cat "$out/SHA256SUMS"
            if [ -z "$first" ]; then
              first="$out/SHA256SUMS"
            elif ! cmp -s "$first" "$out/SHA256SUMS"; then
              echo "::error::the $python build differs from the python3.12 build; release.yml's rebuild job would refuse it"
              exit 1
            fi
          done

  install-test:
    name: install-test (unit tests, PyYAML required)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # The workflow, Ansible and other YAML contract tests fail instead of skipping without PyYAML.
      JWICKET_REQUIRE_YAML: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install PyYAML, pinned by version and wheel hash (CPython 3.12, manylinux x86_64)
        run: |
          req="$RUNNER_TEMP/requirements-yaml.txt"
          echo "PyYAML==6.0.3 --hash=sha256:ba1cc08a7ccde2d2ec775841541641e4548226580ab850948cbfda66a1befcdc" > "$req"
          python -m pip install --require-hashes --only-binary :all: --no-deps -r "$req"
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  install-autospec:
    name: install-autospec (PyEZ, paramiko and scp signatures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Tests that build fakes with unittest.mock.create_autospec fail instead of skipping without PyEZ.
      JWICKET_REQUIRE_PYEZ: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the installer's hash-pinned dependencies
        run: python -m pip install --require-hashes -r requirements-install.txt
      - name: Unit tests against the real libraries' signatures
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  ansible:
    name: ansible (syntax check, contract test)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      JWICKET_REQUIRE_YAML: "1"
      # The behaviour checks (ansible-playbook 2.20.0 against a recording fake) fail instead of skipping.
      JWICKET_REQUIRE_ANSIBLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ansible-core and the installer's dependencies, hash-pinned
        run: python -m pip install --require-hashes -r deploy/ansible/requirements-ansible.txt
      - name: ansible-playbook --syntax-check (no device is contacted)
        working-directory: deploy/ansible
        run: |
          for playbook in install.yml upgrade.yml uninstall.yml status.yml; do
            ansible-playbook --syntax-check -i inventory.example.ini "$playbook"
          done
      - name: Ansible contract test
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_ansible_contract.py" -v

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz: the value in the release's checksums file,
      # checked against the downloaded asset on 2026-11-24.
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint and check its SHA-256
        run: |
          dir="$RUNNER_TEMP/actionlint"
          mkdir "$dir"
          archive="$dir/actionlint.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto "=https" --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --connect-timeout 20 --max-time 120 --output "$archive" "$url"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$dir" actionlint
      - name: actionlint (runs shellcheck on run scripts when the runner image has it)
        run: |
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/ci.yml .github/workflows/release.yml

  container:
    name: container (local image build, never pushed)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Is there a container definition?
        id: present
        run: |
          if [ -f deploy/container/Dockerfile ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::deploy/container/Dockerfile does not exist; nothing to build"
          fi
      - name: Build context from this checkout (the wheel and the hash-pinned requirements)
        if: ${{ steps.present.outputs.build == 'true' }}
        run: make container-context LOCAL=1
      - name: docker build (no push, no registry login)
        if: ${{ steps.present.outputs.build == 'true' }}
        run: docker build --tag jwicket-install:ci deploy/container
      - name: Entry point smoke test (no network, no device; checks the /state mount rule on real Docker)
        if: ${{ steps.present.outputs.build == 'true' }}
        run: |
          # Without a /state mount, an option that writes is refused (exit 2) before the installer runs.
          code=0
          docker run --rm --network none --user "$(id -u):$(id -g)" jwicket-install:ci install --apply --help || code=$?
          if [ "$code" -ne 2 ]; then
            echo "::error::without a /state mount, 'install --apply' must exit 2 (got $code)"
            exit 1
          fi
          # With a private (0700) bind mount owned by the caller, the installer itself runs (--help, exit 0).
          state="$RUNNER_TEMP/state"
          install -d -m 0700 "$state"
          docker run --rm --network none --user "$(id -u):$(id -g)" -v "$state:/state" \
            jwicket-install:ci install --apply --help
