# J-Wicket CI. Read-only: no secrets, no deployment, nothing here touches a device.
name: ci

on:
  # Pull requests run on their own event; push runs only for the default branch, so one push to a
  # PR branch starts one run, not two.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lint:
    name: lint (ruff, mypy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install the pinned development tools
        run: python -m pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check src tests tools
      - name: mypy (strict, Python 3.9 target; see pyproject.toml)
        run: mypy

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor: the on-box Python version is not yet qualified (Q-RT-01).
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Bundle self-test on this Python
        # The bundle's own loader code must run on every supported interpreter, not only the one
        # the bundle job uses. Run isolated and outside the checkout so nothing comes from src/.
        run: |
          python tools/bundle.py --out "$RUNNER_TEMP/jwicket.py"
          cd "$RUNNER_TEMP"
          python -I jwicket.py --bundle-self-test

  bundle:
    name: bundle (dist/jwicket.py)
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python tools/bundle.py --out dist/jwicket.py --source-ref "$SOURCE_REF"
      - name: Rebuild and compare (the build must be reproducible)
        run: python tools/bundle.py --out dist/jwicket.py --source-ref "$SOURCE_REF" --check
      - name: Self-test, isolated and outside the checkout
        run: |
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/dist/jwicket.py" --bundle-self-test
      - name: Checksum
        run: |
          sha256sum dist/jwicket.py
          {
            echo "### dist/jwicket.py"
            echo
            echo "Lab qualification only; not installable on a production SRX (docs/deploy-lab.md)."
            echo
            echo '```'
            sha256sum dist/jwicket.py
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: jwicket-bundle-${{ github.sha }}
          path: dist/jwicket.py
          if-no-files-found: error
          retention-days: 14
