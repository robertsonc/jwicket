<!doctype html>
<!-- data-scheme: the default colour scheme (js/brand.js), so the first paint has its colours. -->
<html lang="en" data-scheme="obsidian">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>J-Wicket</title>
<link rel="icon" href="/static/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
<link rel="stylesheet" href="/static/css/querybar.css">
<link rel="stylesheet" href="/static/css/sessions.css">
<link rel="stylesheet" href="/static/css/logs.css">
<link rel="stylesheet" href="/static/css/policies.css">
<script type="module" src="/static/js/main.js"></script>
</head>
<body>
<a class="skip" id="skip" href="#main">Skip to content</a>

<div id="fixture-banner" class="fixture-banner" role="note" aria-label="Fixture data notice" hidden>
  <p><strong>FIXTURE DATA</strong><span class="fx-long">&mdash; synthetic, not read from a device</span><span class="fx-short">&middot; synthetic</span></p>
</div>

<div id="boot" class="boot">
  <div class="boot-in">
    <svg class="logo-mark" viewBox="15 13 236 236" aria-hidden="true" focusable="false">
      <polygon class="lg-frame" points="99,37 171,37 215.5,68 215.5,192 170,224.5 100,224.5 54.5,192 54.5,68" fill="none" stroke-width="4" stroke-linejoin="round"/>
      <polygon class="lg-j" points="70,60 120,60 134,74 134,165 101,198 70,198 70,176 92,176 111,157 111,83 70,83"/>
      <rect class="lg-acc" x="20" y="126.5" width="59" height="10"/>
      <rect class="lg-acc" x="87" y="121" width="20.5" height="21" rx="4"/>
      <rect class="lg-acc" x="143" y="126.5" width="96" height="10"/>
      <polygon class="lg-acc" points="160,60 195,60 206,71 206,106 183,106 183,83 160,83"/>
      <polygon class="lg-acc" points="183,157 206,157 206,190 194,202 160,202 160,180 183,180"/>
      <polyline class="lg-acc-stroke" points="220,111 240,131.5 220,152" fill="none" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="4"/>
    </svg>
    <p>Starting J-Wicket&hellip;</p>
    <p class="boot-slow">Still starting? Reload the page.</p>
    <noscript><p>J-Wicket needs JavaScript. Everything it runs is served from this device; nothing comes from the internet.</p></noscript>
  </div>
</div>

<section id="signin" class="signin" aria-labelledby="signin-title" hidden>
  <div class="signin-wrap">
    <div class="signin-brand">
      <div class="signin-lockup">
        <svg class="logo-mark" viewBox="15 13 236 236" aria-hidden="true" focusable="false">
          <polygon class="lg-frame" points="99,37 171,37 215.5,68 215.5,192 170,224.5 100,224.5 54.5,192 54.5,68" fill="none" stroke-width="4" stroke-linejoin="round"/>
          <polygon class="lg-j" points="70,60 120,60 134,74 134,165 101,198 70,198 70,176 92,176 111,157 111,83 70,83"/>
          <rect class="lg-acc" x="20" y="126.5" width="59" height="10"/>
          <rect class="lg-acc" x="87" y="121" width="20.5" height="21" rx="4"/>
          <rect class="lg-acc" x="143" y="126.5" width="96" height="10"/>
          <polygon class="lg-acc" points="160,60 195,60 206,71 206,106 183,106 183,83 160,83"/>
          <polygon class="lg-acc" points="183,157 206,157 206,190 194,202 160,202 160,180 183,180"/>
          <polyline class="lg-acc-stroke" points="220,111 240,131.5 220,152" fill="none" stroke-width="10" stroke-linejoin="miter" stroke-miterlimit="4"/>
        </svg>
        <h1 id="signin-title" class="wordmark">J<span class="wm-dash">-</span>Wicket</h1>
      </div>
    </div>
    <div class="signin-card">
      <h2 id="signin-heading">Sign in with your Junos account</h2>
      <p id="signin-notice" class="notice-box" role="status" hidden></p>
      <p id="signin-lab" class="warn-box" hidden></p>
      <form id="signin-form" novalidate>
        <div id="field-username" class="field">
          <label for="username">User name</label>
          <input id="username" class="input" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
        </div>
        <div id="field-password" class="field">
          <label for="password">Password</label>
          <input id="password" class="input" name="password" type="password" autocomplete="current-password">
        </div>
        <div id="field-token" class="field" hidden>
          <label for="token">Lab token</label>
          <input id="token" class="input" name="token" type="password" autocomplete="off" spellcheck="false">
        </div>
        <p id="signin-error" class="error-box" role="alert" hidden></p>
        <button id="signin-submit" class="btn primary" type="submit">Sign in</button>
      </form>
      <p id="signin-copy" class="small muted">Junos checks your user name and password and applies your login class. J-Wicket does not store them.</p>
    </div>
    <ul id="signin-facts" class="signin-facts" aria-label="About this console"></ul>
    <p id="signin-version" class="signin-version"></p>
  </div>
</section>

<div id="app" class="app" hidden>
  <header id="topbar" class="topbar"></header>
  <nav id="rail" class="rail" aria-label="Views"></nav>
  <main id="main" class="main" tabindex="-1"></main>
</div>

<div id="panel-scrim" class="panel-scrim"></div>
<aside id="panel" class="panel" role="dialog" aria-modal="false" aria-labelledby="panel-title" hidden>
  <div class="panel-head">
    <h2 id="panel-title" class="panel-title" tabindex="-1"></h2>
    <div id="panel-actions" class="toolbar"></div>
    <button id="panel-close" class="btn ghost icon" type="button" aria-label="Close panel" title="Close (Esc)"></button>
  </div>
  <div id="panel-body" class="panel-body"></div>
</aside>

<div id="toasts" class="toasts"></div>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="alert" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
</body>
</html>
