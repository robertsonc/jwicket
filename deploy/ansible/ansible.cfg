# J-Wicket M2 (Spec 006 section 6.3). LAB ONLY: every device step is unverified until lab test Q-INST-06.
#
# Ansible reads this file only when ansible-playbook runs in this directory (or ANSIBLE_CONFIG names
# it), and ignores it when this directory is world-writable. The playbooks set everything their
# safety depends on in the plays themselves; these settings keep output readable and keep what the
# operator types out of logs. Run the playbooks from here: cd deploy/ansible.

[defaults]
# Facts are never gathered: the plays talk to no device; jwicket-install does, after its own checks.
gathering = explicit
# Results as YAML: a multi-line string (the executor's plan, the bootstrap paste units) prints as a
# block, without the JSON escaping of quotes that would break a pasted Junos line.
callback_result_format = yaml
# Modules log their arguments to the controller's syslog unless told not to; the apply step's
# arguments include the typed host name.
no_target_syslog = True
display_args_to_stdout = False
# No retry files listing hosts; no log file (log_path is deliberately unset).
retry_files_enabled = False
# Never prompt for or use a password: jwicket-install uses the SSH agent or keys only in M2.
ask_pass = False
# The plays use connection: local. If someone changes that, Ansible still verifies host keys.
host_key_checking = True
# Only ansible.builtin modules are used; collections installed for other projects are not needed.
collections_scan_sys_path = False

[privilege_escalation]
# Nothing here runs as another user on the controller.
become = False
become_ask_pass = False

[connection]
# With the local connection, pipelining feeds each module through standard input instead of a
# temporary file under ~/.ansible/tmp, so the apply step's arguments are not written to disk.
pipelining = True
