# J-Wicket M2 inventory example (Spec 006 section 6.3). LAB ONLY.
#
# Copy to inventory.ini and edit; inventory.ini is ignored by git, so lab addresses stay local.
# The addresses below are documentation addresses (RFC 5737) and reach nothing.
#
# The plays run on this workstation (connection: local) and hand each host to jwicket-install, which
# opens its own SSH and NETCONF sessions with host-key checks. So:
#   * ansible_host is the device's address (or a DNS name) for jwicket-install --host;
#   * jwicket_user is the device account (super-user class, not root) for jwicket-install --user;
#   * jwicket_ssh_port (optional, default 22) is the device's SSH port for jwicket-install --port;
#     NETCONF runs on that same port.
#
# Access (optional; README.md, "Access"): J-Wicket listens with TLS on the device address your browser
# reaches (--access tls, the default) on port 9443. That address defaults to ansible_host when it is an
# IPv4 address; with a DNS name, set jwicket_listen_address (fxp0's address when you reach the device
# through fxp0). jwicket_access=tunnel keeps J-Wicket on the device's loopback behind 'ssh -L' (SSH
# forwarding was refused on a lab SRX4100 running 25.2R1-S1.4). jwicket_daemon_port changes the port.
#   lab-c ansible_host=lab-c.example.net jwicket_listen_address=192.0.2.12
#   lab-d ansible_host=192.0.2.13 jwicket_access=tunnel
#
# Hardware (optional; README.md, "Lab hardware"): anything but a vSRX is refused unless the host has
# jwicket_lab_hardware=true, and then the play also asks you to type 'lab only' after the host name.
# The attestation itself is never a variable.
#   lab-e ansible_host=192.0.2.14 jwicket_lab_hardware=true
#
# /var/db/jwicket must exist first, made once by root on each device (the dry run prints the step).
#
# No passwords, here or anywhere: M2 uses the SSH agent or keys only (ssh-add your lab key before
# the run). The device's host key must already be in ~/.ssh/known_hosts (one ordinary
# "ssh <user>@<device>" login on the same port records it after you compare its fingerprint).
#
# Inventory names (lab-a, lab-b) are your labels and appear in Ansible's output. The lab gate asks
# you to type the device's own host name, which no output shows before the gate; using labels that
# differ from the host names keeps the screen from giving the answer away.

[jwicket_lab]
lab-a ansible_host=192.0.2.10
lab-b ansible_host=192.0.2.11 jwicket_ssh_port=2222

[jwicket_lab:vars]
jwicket_user=labadmin
