---
# J-Wicket M2: install or upgrade J-Wicket on lab SRXs, one host at a time (Spec 006 section 6.3).
#
# LAB ONLY. This installer has not yet run on any device. Every device step is unverified until lab
# test Q-INST-06 is certified.
#
# The play talks to no device and holds no device logic. For each host it runs the workstation
# executor, jwicket-install (M1), on this controller, with an argument list:
#   1. two dry runs, which only read: the plan as jwicket-install prints it (DEVICE_STATUS, the
#      posture and other warnings, the production signs, the plan's diff, and a refusal such as
#      R-STATEDIR with root's one-time step), then the same plan as JSON, parsed only with from_json
#      from the registered standard output;
#   2. only with -e jwicket_apply=true: the lab gate (a pause that shows no host name), and with
#      jwicket_lab_hardware=true a second pause for the typed 'lab only'; then
#      "jwicket-install install --apply --method ansible --gate-from-stdin --json" with the typed
#      answers on standard input, one per line. The executor reads the device's own host name and
#      compares (INV-05), then the attestation; every write it makes is a commit confirmed that it
#      confirms only after its health checks pass.
#
# Access (Spec 006 section 7.5): --access tls is jwicket-install's default (an HTTPS listener on the
# device address the browser reaches, --listen-address, which defaults to --host when that is an IPv4
# address); jwicket_access=tunnel keeps the loopback listener behind 'ssh -L', which SSH refused on
# SRX4100 25.2R1-S1.4 (verified, docs/evidence/2026-11-24-srx4100-lab).
#
# Run from deploy/ansible (so ansible.cfg applies):
#   dry run: ansible-playbook -i inventory.ini install.yml -e jwicket_release=v0.1.0.dev1
#   install: ansible-playbook -i inventory.ini install.yml -e jwicket_release=v0.1.0.dev1 -e jwicket_apply=true
# upgrade.yml imports this play with jwicket_upgrade_only set. README.md lists every variable. M2 uses
# only ansible.builtin modules and no collection.

- name: J-Wicket install or upgrade (LAB ONLY, one host at a time)
  hosts: jwicket_lab
  connection: local
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0
  debugger: never
  vars:
    # An inventory ansible_connection would override the connection keyword; a play variable wins
    # over the inventory, and the input check below refuses an extra variable that changes it.
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    # Keep module arguments (the apply step's include the typed answers) out of the controller's syslog.
    ansible_no_target_syslog: true

  tasks:
    - name: Refuse gate and internal variables that were set outside this play
      # Extra variables (-e) always win over registered and task variables, so a name this play
      # registers or derives must not exist before it runs: no -e, inventory or play value can stand
      # in for a typed answer (the host name or 'lab only'), the device's host name, the dry run or
      # the plan (INV-05, INV-12).
      ansible.builtin.assert:
        that:
          - jwicket_gate_typed is not defined
          - jwicket_lab_typed is not defined
          - jwicket_device_hostname is not defined
          - jwicket_dry_text is not defined
          - jwicket_dry_json is not defined
          - jwicket_plan is not defined
          - jwicket_applied is not defined
          - jwicket_argv is not defined
          - jwicket_exit_codes is not defined
          - jwicket_executable_stat is not defined
        fail_msg: >-
          A gate variable (jwicket_gate_typed, jwicket_lab_typed, jwicket_device_hostname) or a
          variable this play sets for itself (jwicket_dry_text, jwicket_dry_json, jwicket_plan,
          jwicket_applied, jwicket_argv, jwicket_exit_codes, jwicket_executable_stat) was given from
          outside: as an extra variable (-e), in the inventory, or in a variable file. Remove it. The
          lab gate takes the host name and the 'lab only' attestation only from what you type at its
          prompts, and jwicket-install compares the name with the one the device reports.
        quiet: true

    - name: Check the inputs before anything runs
      ansible.builtin.assert:
        that:
          - ansible_connection == 'local'
          - jwicket_release is defined
          - jwicket_release is string
          - jwicket_release == jwicket_release | trim
          - jwicket_release is match('^v[0-9]+[.][0-9]+[.][0-9]+[.]dev[0-9]+$')
          - jwicket_user is defined
          - jwicket_user is string
          - jwicket_user == jwicket_user | trim
          - jwicket_user is match('^[A-Za-z][A-Za-z0-9._-]{0,31}$')
          - jwicket_user != 'root'
          - ansible_host | default(inventory_hostname) is string
          - ansible_host | default(inventory_hostname) == ansible_host | default(inventory_hostname) | trim
          - ansible_host | default(inventory_hostname) is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,252}$')
          - jwicket_ssh_port is not defined or jwicket_ssh_port | string is match('^[1-9][0-9]{0,4}$')
          - jwicket_ssh_port is not defined or jwicket_ssh_port | int <= 65535
          # Access (Spec 006 section 7.5): tls (jwicket-install's default) or tunnel.
          - jwicket_access is not defined or jwicket_access in ['tls', 'tunnel']
          # The listen address: an IPv4 address in canonical form (plan.canonical_address refuses any
          # other spelling), and only with tls.
          - jwicket_listen_address is not defined or jwicket_listen_address is string
          - jwicket_listen_address is not defined or jwicket_listen_address == jwicket_listen_address | trim
          - jwicket_listen_address is not defined or jwicket_listen_address is match('^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])([.](25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$')
          - jwicket_listen_address is not defined or jwicket_access | default('tls') == 'tls'
          # J-Wicket's own port (--daemon-port, 1024 to 65535; 9443 with tls and 8443 with tunnel when unset).
          - jwicket_daemon_port is not defined or jwicket_daemon_port | string is match('^[1-9][0-9]{3,4}$')
          - jwicket_daemon_port is not defined or jwicket_daemon_port | int >= 1024
          - jwicket_daemon_port is not defined or jwicket_daemon_port | int <= 65535
          - jwicket_lab_hardware | default(false) | string | lower in ['true', 'false', 'yes', 'no']
          - jwicket_bootstrap_nonce is not defined or jwicket_bootstrap_nonce is string
          - jwicket_bootstrap_nonce is not defined or jwicket_bootstrap_nonce == jwicket_bootstrap_nonce | trim
          - jwicket_bootstrap_nonce is not defined or jwicket_bootstrap_nonce is match('^[a-z0-9]{6}$')
          - (jwicket_expect_sha256 is defined) == (jwicket_expect_source is defined)
          - jwicket_expect_sha256 is not defined or jwicket_expect_sha256 is string
          - jwicket_expect_sha256 is not defined or jwicket_expect_sha256 == jwicket_expect_sha256 | trim
          - jwicket_expect_sha256 is not defined or jwicket_expect_sha256 is match('^[0-9a-f]{64}$')
          - jwicket_expect_source is not defined or jwicket_expect_source is string
          - jwicket_expect_source is not defined or jwicket_expect_source == jwicket_expect_source | trim
          # jwicket-install's own rule (provenance.SOURCE_TOKEN_RE): one plain word, at most 64 characters.
          - jwicket_expect_source is not defined or jwicket_expect_source is match('^[A-Za-z0-9][A-Za-z0-9._:/@+=-]{0,63}$')
          - jwicket_overrides | default([]) is sequence
          - jwicket_overrides | default([]) is not string
          - jwicket_overrides | default([]) is not mapping
          # --lab-hardware is not an override here: it comes with its own typed pause (jwicket_lab_hardware).
          - jwicket_overrides | default([]) | difference(['--adopt', '--ack-managed', '--ack-commit-scripts', '--veriexec-not-enforcing-ok', '--trust-release-page-only', '--accept-unchecked-diagnostics', '--no-jet-checksum']) | length == 0
          - jwicket_install_executable is not defined or jwicket_install_executable is string
          - jwicket_install_executable is not defined or jwicket_install_executable == jwicket_install_executable | trim
          - jwicket_install_executable is not defined or jwicket_install_executable is match('^/[-A-Za-z0-9 ._/+@~]*$')
          - jwicket_apply | default(false) | string | lower in ['true', 'false', 'yes', 'no']
          - not (ansible_check_mode and jwicket_apply | default(false) | bool)
          - jwicket_upgrade_only | default(false) | string | lower in ['true', 'false']
        fail_msg: >-
          An input is missing or not in the expected form. Needed: jwicket_release (a pre-release tag
          such as v0.1.0.dev1), jwicket_user (the device account: letters, digits, '.', '_', '-', not
          root), ansible_host or the inventory name (a host name or IPv4 address). Optional:
          jwicket_ssh_port (1 to 65535), jwicket_access (tls or tunnel), jwicket_listen_address (an
          IPv4 address such as 192.0.2.10, tls only), jwicket_daemon_port (1024 to 65535),
          jwicket_lab_hardware (true or false), jwicket_bootstrap_nonce (the 6 lowercase letters or
          digits from the bootstrap units), jwicket_expect_sha256 (64 lowercase hex) together with
          jwicket_expect_source (where that hash came from: one word, at most 64 characters),
          jwicket_overrides (a list of jwicket-install override flags this play allows: see
          README.md), jwicket_install_executable (an absolute path), jwicket_apply (true or false, and
          not with --check). Nothing was run.
        quiet: true

    - name: Check that tls has an address to listen on
      # jwicket-install defaults --listen-address to --host only when that is an IP address
      # (plan.default_listen_address); otherwise it exits 2. Said here first, with the variable's name.
      ansible.builtin.assert:
        that:
          - >-
            jwicket_access | default('tls') == 'tunnel' or jwicket_listen_address is defined
            or ansible_host | default(inventory_hostname) is match('^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])([.](25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}$')
        fail_msg: >-
          {{ inventory_hostname }}: --access tls (the default) listens on the device address your browser
          reaches, and ansible_host is not an IPv4 address that could stand for it. Set
          jwicket_listen_address (fxp0's address when you reach the device through fxp0: 'show interfaces
          terse fxp0'), or jwicket_access=tunnel (SSH forwarding was refused on SRX4100 25.2R1-S1.4).
          Nothing was run.
        quiet: true

    - name: Check that jwicket-install is installed on this controller
      ansible.builtin.stat:
        path: "{{ jwicket_argv.executable }}"
      vars: &jwicket_vars
        # The executor's argument list, built only from the inputs checked above; never a shell line.
        jwicket_argv:
          executable: "{{ jwicket_install_executable | default(ansible_playbook_python | dirname ~ '/jwicket-install') }}"
          target: >-
            {{ ['--host', ansible_host | default(inventory_hostname), '--user', jwicket_user]
            + (['--port', jwicket_ssh_port | string] if jwicket_ssh_port is defined else []) }}
          # --method ansible: recorded in the receipts, and the only method that may take --gate-from-stdin.
          options: >-
            {{ ['--method', 'ansible']
            + (['--access', jwicket_access] if jwicket_access is defined else [])
            + (['--listen-address', jwicket_listen_address] if jwicket_listen_address is defined else [])
            + (['--daemon-port', jwicket_daemon_port | string] if jwicket_daemon_port is defined else [])
            + (['--lab-hardware'] if jwicket_lab_hardware | default(false) | bool else [])
            + (['--bootstrap-nonce', jwicket_bootstrap_nonce] if jwicket_bootstrap_nonce is defined else [])
            + (['--expect-sha256', jwicket_expect_sha256, '--expect-source', jwicket_expect_source]
            if jwicket_expect_sha256 is defined else [])
            + (jwicket_overrides | default([]) | list) }}
        # jwicket-install's exit codes (Spec 006 section 9.7).
        jwicket_exit_codes:
          0: done, dry run printed, or nothing to change
          1: >-
            refused (R-STATEDIR among them: root makes /var/db/jwicket once), the device could not be
            read, or NETCONF is off (bootstrap units printed)
          2: bad arguments or inputs
          3: >-
            lab gate not passed (the typed name did not match the device's host name, or 'lab only' was
            not typed after --lab-hardware), or no answer
          4: the device refused a step before that stage's commit (lock, load, commit or file)
          5: a check failed after commit confirmed; Junos rolled that stage back and the revert stage ran
          6: the device's change differed from the plan; nothing was committed in that stage
          7: transfer, integrity or provenance failure (download, SHA-256, owner or mode, no independent source)
          8: uninstall incomplete
      register: jwicket_executable_stat

    - name: Stop when jwicket-install is missing
      ansible.builtin.fail:
        msg: >-
          jwicket-install was not found, or is not executable, at {{ jwicket_argv.executable }}. Install
          the installer wheel into the virtual environment that runs ansible-playbook (README.md, set-up
          step 3), or set jwicket_install_executable to its absolute path. Nothing was run.
      vars: *jwicket_vars
      when: not (jwicket_executable_stat.stat.exists and jwicket_executable_stat.stat.executable)

    - name: Dry run, the plan as jwicket-install prints it (reads only; nothing is written)
      ansible.builtin.command:
        argv: "{{ [jwicket_argv.executable, 'install', '--release', jwicket_release] + jwicket_argv.target + jwicket_argv.options }}"
      vars: *jwicket_vars
      register: jwicket_dry_text
      changed_when: false
      failed_when: false
      check_mode: false
      timeout: 900

    - name: Show the plan (no host name is shown before the gate)
      ansible.builtin.debug:
        msg: "{{ jwicket_dry_text.stdout }}"

    - name: Show jwicket-install's diagnostics
      ansible.builtin.debug:
        msg: "{{ jwicket_dry_text.stderr }}"
      when: jwicket_dry_text.stderr | default('') | length > 0

    - name: Stop this host when the dry run did not succeed
      ansible.builtin.fail:
        msg: >-
          jwicket-install exited {{ jwicket_dry_text.rc }}: {{ jwicket_exit_codes[jwicket_dry_text.rc] | default('unknown exit code') }}.
          Nothing was written to the device. Read the output above: it says what failed and what to do.
          If it reports R-STATEDIR: the installer never creates /var/db/jwicket and never logs in as root.
          Once, in a shell on the lab device as root, run
          'mkdir -m 700 /var/db/jwicket && chown {{ jwicket_user }} /var/db/jwicket' (the step used on a
          lab SRX4100), then run this playbook again.
          If it says NETCONF is off, paste the bootstrap units A to D it printed on that device (an SSH
          or console session), leave unit C's commit confirmed unconfirmed, and within its ten minutes run
          this playbook again with --limit {{ inventory_hostname }} -e jwicket_bootstrap_nonce=<the nonce
          in unit C's comment>.
      vars: *jwicket_vars
      when: jwicket_dry_text.rc != 0

    - name: Dry run again for the machine-readable plan (reads only)
      ansible.builtin.command:
        argv: "{{ [jwicket_argv.executable, 'install', '--release', jwicket_release] + jwicket_argv.target + jwicket_argv.options + ['--json'] }}"
      vars: *jwicket_vars
      register: jwicket_dry_json
      changed_when: false
      failed_when: false
      check_mode: false
      timeout: 900

    - name: Stop this host when the JSON dry run did not succeed
      ansible.builtin.fail:
        msg: >-
          jwicket-install --json exited {{ jwicket_dry_json.rc }}: {{ jwicket_exit_codes[jwicket_dry_json.rc] | default('unknown exit code') }}.
          Nothing was written to the device. Its diagnostics: {{ jwicket_dry_json.stderr | default('') }}
      vars: *jwicket_vars
      when: jwicket_dry_json.rc != 0

    - name: Check the plan document (parsed only from jwicket-install's own output)
      ansible.builtin.assert:
        that:
          - jwicket_plan is mapping
          - jwicket_plan.schema | default(none) == 2
          - jwicket_plan.blocked | default(true) is false
          - jwicket_plan.no_change | default(none) is boolean
          - jwicket_plan.stages | default(none) is sequence
          - jwicket_plan.access | default(none) in ['tls', 'tunnel']
          - jwicket_plan.lab_hardware | default(none) is boolean
          # A plan for hardware is blocked without --lab-hardware (R-MODEL), so this fails only when the
          # executor and this play disagree; then nothing is asked or written.
          - jwicket_plan.lab_hardware is false or jwicket_lab_hardware | default(false) | bool
        fail_msg: >-
          jwicket-install's JSON plan is not a plan of schema 2 that can proceed (blocked, or another
          installer version than this playbook expects). Nothing was written to the device.
        quiet: true
      vars:
        jwicket_plan: "{{ jwicket_dry_json.stdout | from_json }}"

    - name: Refuse a first install from upgrade.yml
      ansible.builtin.assert:
        that:
          - jwicket_plan.upgrade is true or jwicket_plan.no_change is true
        fail_msg: >-
          upgrade.yml changes an existing J-Wicket install only, and the plan for this host is not an
          upgrade (no earlier build that this installer recorded). Use install.yml for a first install or
          a repair. Nothing was written to the device.
        quiet: true
      vars:
        jwicket_plan: "{{ jwicket_dry_json.stdout | from_json }}"
      when: jwicket_upgrade_only | default(false) | bool

    - name: Plan summary (from the JSON plan; the warnings' texts are in the plan shown above)
      ansible.builtin.debug:
        msg: |-
          bundle: {{ jwicket_plan.bundle.version }}, sha256 {{ jwicket_plan.bundle.file_sha256 }}
          provenance: {{ jwicket_plan.provenance.kind }}{{ '' if jwicket_plan.provenance.evidence else ' (NOT qualification evidence)' }}
          device: model {{ jwicket_plan.device.model }}, release {{ jwicket_plan.device.junos_version }}, serial {{ jwicket_plan.device.serial }}
          lab hardware (not a vSRX; 'lab only' is asked after the host name): {{ jwicket_plan.lab_hardware }}
          access: {{ jwicket_plan.access }} on {{ (jwicket_plan.listen_address ~ ':' ~ jwicket_plan.port) if jwicket_plan.access == 'tls' else ('127.0.0.1:' ~ jwicket_plan.port ~ ', behind ssh -L') }}{{ (', routing instance ' ~ jwicket_plan.routing_instance) if jwicket_plan.routing_instance else '' }}
          upgrade: {{ jwicket_plan.upgrade }}; nothing to change: {{ jwicket_plan.no_change }}
          bootstrap to confirm after the gate: {{ jwicket_plan.bootstrap.kind ~ ' ' ~ jwicket_plan.bootstrap.nonce if jwicket_plan.bootstrap else 'none' }}
          warnings: {{ jwicket_plan.warnings | join(', ') }}
          overrides: {{ jwicket_plan.overrides | join(', ') if jwicket_plan.overrides else 'none' }}
          {% for sign in jwicket_plan.production_signs %}
          production sign: {{ sign }}
          {% endfor %}
          {% for stage in jwicket_plan.stages %}
          stage {{ stage.name }} (commit confirmed {{ stage.confirm_minutes }}, checks {{ stage.checks | join(' ') }}):
          {% for line in stage.lines %}
            {{ line }}
          {% endfor %}
          {% endfor %}
          {% for file in jwicket_plan.files %}
          file {{ file.path }} mode {{ file.mode }} ({{ file.action }})
          {% endfor %}
      vars:
        jwicket_plan: "{{ jwicket_dry_json.stdout | from_json }}"

    - name: Dry run finished (add -e jwicket_apply=true to install)
      ansible.builtin.debug:
        msg: >-
          Dry run only: nothing was written to the device. To install, run this playbook again with
          -e jwicket_apply=true and type the device's host name at the lab gate.
      when: not (jwicket_apply | default(false) | bool)

    - name: Nothing to change on this host
      ansible.builtin.debug:
        msg: >-
          J-Wicket from this release is already installed and nothing differs, so there is no gate and no
          commit. status.yml runs the read-only checks.
      when:
        - jwicket_apply | default(false) | bool
        - (jwicket_dry_json.stdout | from_json).no_change is true

    - name: Lab gate, then install
      when:
        - jwicket_apply | default(false) | bool
        - (jwicket_dry_json.stdout | from_json).no_change is false
      block:
        - name: "Lab gate: type the device's host name (nothing has been written yet)"
          # LAB_GATE_PROMPT of tools/jwicket_install/plan.py; Ansible adds the final colon. The prompt
          # shows no host name, and the answer is registered only here.
          ansible.builtin.pause:
            prompt: >-
              This installer is for lab devices only. J-Wicket has not passed gate G1. Type the host
              name of the lab device you intend to change (the name set with 'set system host-name').
              Typing it confirms that this device is a disposable lab device you are allowed to change;
              it does not prove it. Press Enter to stop
          register: jwicket_gate_typed
          no_log: true

        - name: Stop when the gate got no answer (Enter pressed, or no terminal)
          # Without a terminal, ansible.builtin.pause does not wait and returns an empty answer
          # (ansible-core 2.20.0, plugins/action/pause.py); an empty answer never passes.
          ansible.builtin.assert:
            that:
              - jwicket_gate_typed.user_input is defined
              - jwicket_gate_typed.user_input is string
              - jwicket_gate_typed.user_input | trim | length > 0
            fail_msg: >-
              The lab gate got no answer, so nothing was written. Run ansible-playbook from a terminal
              and type the device's host name at the prompt.
            quiet: true

        - name: "Lab hardware: type 'lab only' (nothing has been written yet)"
          # LAB_HARDWARE_PROMPT of tools/jwicket_install/plan.py; Ansible adds the final colon. Asked
          # only with jwicket_lab_hardware; the production signs were shown above, before both prompts.
          # jwicket-install compares the host name first and this answer only on a match (Spec 006 8.2).
          ansible.builtin.pause:
            prompt: >-
              Type 'lab only' to state that this device carries only lab traffic: no production traffic,
              user or service depends on it, and its owner approved this run ('show chassis hardware' and
              'show configuration system services outbound-ssh' help you check). Your statement is recorded
              in the install record; it does not prove anything. Press Enter to stop
          register: jwicket_lab_typed
          no_log: true
          when: jwicket_lab_hardware | default(false) | bool

        - name: Stop when 'lab only' got no answer (Enter pressed, or no terminal)
          ansible.builtin.assert:
            that:
              - jwicket_lab_typed.user_input is defined
              - jwicket_lab_typed.user_input is string
              - jwicket_lab_typed.user_input | trim | length > 0
            fail_msg: >-
              The lab-hardware attestation got no answer, so nothing was written. Run ansible-playbook from
              a terminal and type 'lab only' at the prompt, or leave out jwicket_lab_hardware.
            quiet: true
          when: jwicket_lab_hardware | default(false) | bool

        - name: Install through jwicket-install, gated on the device's own host name
          ansible.builtin.command:
            argv: >-
              {{ [jwicket_argv.executable, 'install', '--apply', '--release', jwicket_release]
              + jwicket_argv.target + jwicket_argv.options + ['--gate-from-stdin', '--json'] }}
            # One answer per line: the host name, then 'lab only' with jwicket_lab_hardware. Double-quoted,
            # so YAML makes the newline: Ansible keeps a backslash inside a template as it is.
            stdin: "{{ jwicket_gate_typed.user_input ~ (('\n' ~ jwicket_lab_typed.user_input) if jwicket_lab_hardware | default(false) | bool else '') }}"
          vars: *jwicket_vars
          register: jwicket_applied
          # The arguments include the typed answers; the next tasks show the executor's output, which
          # never carries a credential (INV-08).
          no_log: true
          changed_when: jwicket_applied.rc == 0
          failed_when: false
          timeout: 3600

        - name: Show the result (jwicket-install's JSON document)
          ansible.builtin.debug:
            msg: "{{ jwicket_applied.stdout | from_json if jwicket_applied.stdout | trim is match('[{]') else jwicket_applied.stdout }}"

        - name: Show jwicket-install's diagnostics
          ansible.builtin.debug:
            msg: "{{ jwicket_applied.stderr }}"
          when: jwicket_applied.stderr | default('') | length > 0

        - name: Stop when the install did not succeed
          ansible.builtin.fail:
            msg: >-
              jwicket-install exited {{ jwicket_applied.rc }}: {{ jwicket_exit_codes[jwicket_applied.rc] | default('unknown exit code') }}.
              Its output above says what was rolled back and what to do next. Remaining hosts are not
              changed.
          vars: *jwicket_vars
          when: jwicket_applied.rc != 0
